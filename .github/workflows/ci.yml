name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          install_args: go # the Go version from mise.toml; the wasm toolchain is not needed here
      - run: mise run lint
      - run: mise run test
  wasm:
    # The committed wasm/qjs.wasm must be reproducible from the pinned
    # sources and the toolchain mise.toml declares, on both hosts.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - run: mise run wasm
      - name: committed module is up to date
        run: git diff --exit-code --stat wasm/qjs.wasm
